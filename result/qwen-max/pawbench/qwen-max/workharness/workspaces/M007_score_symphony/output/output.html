<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Symphony No. 5 Mvt. 1</title>
</head>
<body>
    <h1>Symphony No. 5 Mvt. 1 by Beethoven</h1>
    <p>Tempo: quarter = 170</p>
    <svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Title, Composer, and Tempo -->
  <text x="10" y="20" font-family="Arial" font-size="14">Symphony No. 5 Mvt. 1</text>
  <text x="10" y="40" font-family="Arial" font-size="14">Beethoven</text>
  <text x="10" y="60" font-family="Arial" font-size="14">Tempo: quarter = 170</text>
  
  <!-- Staves with a brace -->
  <line x1="10" y1="80" x2="790" y2="80" stroke="black" />
  <line x1="10" y1="120" x2="790" y2="120" stroke="black" />
  <path d="M10 70 Q 10 75 15 80 T 20 85 Q 25 80 30 75 T 35 70" stroke="black" fill="none" />
  
  <!-- Key signature (C minor) and Time signature (2/4) -->
  <text x="50" y="70" font-family="Arial" font-size="20">♭♭♭</text>
  <text x="50" y="110" font-family="Arial" font-size="20">2/4</text>
  
  <!-- Measure 1 (G4 in treble, G2+G3 in bass) -->
  <circle cx="120" cy="80" r="5" fill="black" />
  <line x1="130" y1="80" x2="160" y2="80" stroke="black" />
  <line x1="130" y1="85" x2="160" y2="85" stroke="black" />
  <line x1="130" y1="90" x2="160" y2="90" stroke="black" />
  <line x1="130" y1="85" x2="130" y2="90" stroke="black" />
  <line x1="150" y1="85" x2="150" y2="90" stroke="black" />
  <line x1="120" y1="120" x2="120" y2="130" stroke="black" />
  <line x1="120" y1="140" x2="120" y2="150" stroke="black" />
  <line x1="130" y1="120" x2="160" y2="120" stroke="black" />
  <line x1="130" y1="125" x2="160" y2="125" stroke="black" />
  <line x1="130" y1="130" x2="160" y2="130" stroke="black" />
  <line x1="130" y1="125" x2="130" y2="130" stroke="black" />
  <line x1="150" y1="125" x2="150" y2="130" stroke="black" />
  
  <!-- Measure 2 (Eb4 in treble, Eb2+Eb3 in bass) -->
  <circle cx="220" cy="80" r="5" fill="black" />
  <line x1="220" y1="80" x2="220" y2="100" stroke="black" />
  <line x1="220" y1="120" x2="220" y2="140" stroke="black" />
  
  <!-- Measure 3 (F4 in treble, F2+F3 in bass) - similar to Measure 1 but lower -->
  <circle cx="320" cy="80" r="5" fill="black" />
  <line x1="330" y1="80" x2="360" y2="80" stroke="black" />
  <line x1="330" y1="85" x2="360" y2="85" stroke="black" />
  <line x1="330" y1="90" x2="360" y2="90" stroke="black" />
  <line x1="330" y1="85" x2="330" y2="90" stroke="black" />
  <line x1="350" y1="85" x2="350" y2="90" stroke="black" />
  <line x1="320" y1="120" x2="320" y2="130" stroke="black" />
  <line x1="320" y1="140" x2="320" y2="150" stroke="black" />
  <line x1="330" y1="120" x2="360" y2="120" stroke="black" />
  <line x1="330" y1="125" x2="360" y2="125" stroke="black" />
  <line x1="330" y1="130" x2="360" y2="130" stroke="black" />
  <line x1="330" y1="125" x2="330" y2="130" stroke="black" />
  <line x1="350" y1="125" x2="350" y2="130" stroke="black" />
  
  <!-- Measure 4 (D4 with tie to Measure 5 in treble, D2+D3 with tie in bass) -->
  <circle cx="420" cy="80" r="5" fill="black" />
  <line x1="420" y1="80" x2="420" y2="100" stroke="black" />
  <line x1="420" y1="80" x2="520" y2="80" stroke="black" />
  <line x1="420" y1="120" x2="420" y2="140" stroke="black" />
  <line x1="420" y1="120" x2="520" y2="120" stroke="black" />
  
  <!-- Measure 5 (continuation of D4 in treble, bass clef change to treble at end) -->
  <circle cx="520" y="80" r="5" fill="black" />
  <line x1="520" y1="80" x2="520" y2="100" stroke="black" />
  <line x1="520" y1="120" x2="520" y2="140" stroke="black" />
  <path d="M520 115 L 520 110 Q 530 110 540 115 T 550 120" stroke="black" fill="none" />
  <path d="M520 155 L 520 150 Q 530 150 540 155 T 550 160" stroke="black" fill="none" />
  
  <!-- Bar lines and other notations as needed -->
  <line x1="10" y1="80" x2="10" y2="120" stroke="black" />
  <line x1="100" y1="80" x2="100" y2="120" stroke="black" />
  <line x1="200" y1="80" x2="200" y2="120" stroke="black" />
  <line x1="300" y1="80" x2="300" y2="120" stroke="black" />
  <line x1="400" y1="80" x2="400" y2="120" stroke="black" />
  <line x1="500" y1="80" x2="500" y2="120" stroke="black" />
  <line x1="600" y1="80" x2="600" y2="120" stroke="black" />
  <line x1="790" y1="80" x2="790" y2="120" stroke="black" />
</svg>
</body>
</html>
