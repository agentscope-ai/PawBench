<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Canon in D by Johann Pachelbel</title>
    <style>
        svg { width: 100%; height: auto; }
    </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1">
  <text x="10" y="50" font-family="Arial" font-size="30" fill="black">Canon in D</text>
<text x="10" y="80" font-family="Arial" font-size="20" fill="black">Johann Pachelbel</text>
<text x="10" y="110" font-family="Arial" font-size="20" fill="black">Tempo: quarter = 100</text>

<!-- Treble Clef Staff -->
<line x1="10" y1="150" x2="900" y2="150" stroke="black" stroke-width="2"/>
<line x1="10" y1="200" x2="900" y2="200" stroke="black" stroke-width="2"/>
<line x1="10" y1="250" x2="900" y2="250" stroke="black" stroke-width="2"/>
<line x1="10" y1="300" x2="900" y2="300" stroke="black" stroke-width="2"/>
<line x1="10" y1="350" x2="900" y2="350" stroke="black" stroke-width="2"/>

<!-- Bass Clef Staff -->
<line x1="10" y1="400" x2="900" y2="400" stroke="black" stroke-width="2"/>
<line x1="10" y1="450" x2="900" y2="450" stroke="black" stroke-width="2"/>
<line x1="10" y1="500" x2="900" y2="500" stroke="black" stroke-width="2"/>
<line x1="10" y1="550" x2="900" y2="550" stroke="black" stroke-width="2"/>
<line x1="10" y1="600" x2="900" y2="600" stroke="black" stroke-width="2"/>

<!-- Braces -->
<path d="M10 375 Q 10 425 50 425 T 90 425" stroke="black" stroke-width="2" fill="none"/>
<path d="M10 125 Q 10 175 50 175 T 90 175" stroke="black" stroke-width="2" fill="none"/>

<!-- Key Signature (D Major) -->
<line x1="150" y1="150" x2="150" y2="350" stroke="black" stroke-width="2"/>
<line x1="150" y1="200" x2="150" y2="300" stroke="black" stroke-width="2"/>
<line x1="150" y1="250" x2="150" y2="350" stroke="black" stroke-width="2"/>
<line x1="150" y1="400" x2="150" y2="600" stroke="black" stroke-width="2"/>
<line x1="150" y1="450" x2="150" y2="550" stroke="black" stroke-width="2"/>
<line x1="150" y1="500" x2="150" y2="600" stroke="black" stroke-width="2"/>

<!-- Time Signature (4/4) -->
<text x="200" y="300" font-family="Arial" font-size="50" fill="black">4</text>
<text x="200" y="350" font-family="Arial" font-size="50" fill="black">4</text>

<!-- Barlines for 8 measures -->
<line x1="250" y1="150" x2="250" y2="600" stroke="black" stroke-width="2"/>
<line x1="350" y1="150" x2="350" y2="600" stroke="black" stroke-width="2"/>
<line x1="450" y1="150" x2="450" y2="600" stroke="black" stroke-width="2"/>
<line x1="550" y1="150" x2="550" y2="600" stroke="black" stroke-width="2"/>
<line x1="650" y1="150" x2="650" y2="600" stroke="black" stroke-width="2"/>
<line x1="750" y1="150" x2="750" y2="600" stroke="black" stroke-width="2"/>
<line x1="850" y1="150" x2="850" y2="600" stroke="black" stroke-width="2"/>

<!-- Measure 1 (Bass) -->
<!-- D3, F#3, A3, D4, A2, C#3, E3, A3 -->
<circle cx="270" cy="420" r="10" fill="black" />
<circle cx="270" cy="445" r="10" fill="black" />
<circle cx="270" cy="470" r="10" fill="black" />
<circle cx="270" cy="495" r="10" fill="black" />
<circle cx="270" cy="520" r="10" fill="black" />
<circle cx="270" cy="545" r="10" fill="black" />
<circle cx="270" cy="570" r="10" fill="black" />
<circle cx="270" cy="595" r="10" fill="black" />
<line x1="270" y1="425" x2="290" y2="425" stroke="black" stroke-width="2"/>
<line x1="270" y1="475" x2="290" y2="475" stroke="black" stroke-width="2"/>
<line x1="270" y1="525" x2="290" y2="525" stroke="black" stroke-width="2"/>
<line x1="270" y1="575" x2="290" y2="575" stroke="black" stroke-width="2"/>

<!-- Measure 2 (Bass) -->
<!-- B2, D3, F#3, B3, F#2, A2, C#3, F#3 -->
<circle cx="370" cy="520" r="10" fill="black" />
<circle cx="370" cy="445" r="10" fill="black" />
<circle cx="370" cy="470" r="10" fill="black" />
<circle cx="370" cy="495" r="10" fill="black" />
<circle cx="370" cy="420" r="10" fill="black" />
<circle cx="370" cy="445" r="10" fill="black" />
<circle cx="370" cy="470" r="10" fill="black" />
<circle cx="370" cy="495" r="10" fill="black" />
<line x1="370" y1="425" x2="390" y2="425" stroke="black" stroke-width="2"/>
<line x1="370" y1="475" x2="390" y2="475" stroke="black" stroke-width="2"/>
<line x1="370" y1="525" x2="390" y2="525" stroke="black" stroke-width="2"/>
<line x1="370" y1="575" x2="390" y2="575" stroke="black" stroke-width="2"/>

<!-- Measure 3 (Bass) -->
<!-- G2, B2, D3, G3, D3, F#3, A3, D4 -->
<circle cx="470" cy="520" r="10" fill="black" />
<circle cx="470" cy="445" r="10" fill="black" />
<circle cx="470" cy="470" r="10" fill="black" />
<circle cx="470" cy="495" r="10" fill="black" />
<circle cx="470" cy="445" r="10" fill="black" />
<circle cx="470" cy="470" r="10" fill="black" />
<circle cx="470" cy="495" r="10" fill="black" />
<circle cx="470" cy="520" r="10" fill="black" />
<line x1="470" y1="425" x2="490" y2="425" stroke="black" stroke-width="2"/>
<line x1="470" y1="475" x2="490" y2="475" stroke="black" stroke-width="2"/>
<line x1="470" y1="525" x2="490" y2="525" stroke="black" stroke-width="2"/>
<line x1="470" y1="575" x2="490" y2="575" stroke="black" stroke-width="2"/>

<!-- Measure 4 (Bass) -->
<!-- G2, B2, D3, G3, A2, C#3, E3, A3 -->
<circle cx="570" cy="520" r="10" fill="black" />
<circle cx="570" cy="445" r="10" fill="black" />
<circle cx="570" cy="470" r="10" fill="black" />
<circle cx="570" cy="495" r="10" fill="black" />
<circle cx="570" cy="420" r="10" fill="black" />
<circle cx="570" cy="445" r="10" fill="black" />
<circle cx="570" cy="470" r="10" fill="black" />
<circle cx="570" cy="495" r="10" fill="black" />
<line x1="570" y1="425" x2="590" y2="425" stroke="black" stroke-width="2"/>
<line x1="570" y1="475" x2="590" y2="475" stroke="black" stroke-width="2"/>
<line x1="570" y1="525" x2="590" y2="525" stroke="black" stroke-width="2"/>
<line x1="570" y1="575" x2="590" y2="575" stroke="black" stroke-width="2"/>

<!-- Measure 5 (Treble and Bass) -->
<!-- Treble: F#5, E5 -->
<circle cx="670" cy="270" r="10" fill="black" />
<circle cx="670" cy="320" r="10" fill="black" />
<line x1="670" y1="275" x2="690" y2="275" stroke="black" stroke-width="2"/>
<line x1="670" y1="325" x2="690" y2="325" stroke="black" stroke-width="2"/>

<!-- Bass: G2, B2, D3, G3, A2, C#3, E3, A3 (same as M4) -->
<circle cx="670" cy="520" r="10" fill="black" />
<circle cx="670" cy="445" r="10" fill="black" />
<circle cx="670" cy="470" r="10" fill="black" />
<circle cx="670" cy="495" r="10" fill="black" />
<circle cx="670" cy="420" r="10" fill="black" />
<circle cx="670" cy="445" r="10" fill="black" />
<circle cx="670" cy="470" r="10" fill="black" />
<circle cx="670" cy="495" r="10" fill="black" />
<line x1="670" y1="425" x2="690" y2="425" stroke="black" stroke-width="2"/>
<line x1="670" y1="475" x2="690" y2="475" stroke="black" stroke-width="2"/>
<line x1="670" y1="525" x2="690" y2="525" stroke="black" stroke-width="2"/>
<line x1="670" y1="575" x2="690" y2="575" stroke="black" stroke-width="2"/>

<!-- Measure 6 (Treble and Bass) -->
<!-- Treble: D5, C#5 -->
<circle cx="770" cy="320" r="10" fill="black" />
<circle cx="770" cy="370" r="10" fill="black" />
<line x1="770" y1="325" x2="790" y2="325" stroke="black" stroke-width="2"/>
<line x1="770" y1="375" x2="790" y2="375" stroke="black" stroke-width="2"/>

<!-- Bass: G2, B2, D3, G3, A2, C#3, E3, A3 (same as M4) -->
<circle cx="770" cy="520" r="10" fill="black" />
<circle cx="770" cy="445" r="10" fill="black" />
<circle cx="770" cy="470" r="10" fill="black" />
<circle cx="770" cy="495" r="10" fill="black" />
<circle cx="770" cy="420" r="10" fill="black" />
<circle cx="770" cy="445" r="10" fill="black" />
<circle cx="770" cy="470" r="10" fill="black" />
<circle cx="770" cy="495" r="10" fill="black" />
<line x1="770" y1="425" x2="790" y2="425" stroke="black" stroke-width="2"/>
<line x1="770" y1="475" x2="790" y2="475" stroke="black" stroke-width="2"/>
<line x1="770" y1="525" x2="790" y2="525" stroke="black" stroke-width="2"/>
<line x1="770" y1="575" x2="790" y2="575" stroke="black" stroke-width="2"/>

<!-- Measure 7 (Treble and Bass) -->
<!-- Treble: B4, A4 -->
<circle cx="870" cy="370" r="10" fill="black" />
<circle cx="870" cy="420" r="10" fill="black" />
<line x1="870" y1="375" x2="890" y2="375" stroke="black" stroke-width="2"/>
<line x1="870" y1="425" x2="890" y2="425" stroke="black" stroke-width="2"/>

<!-- Bass: G2, B2, D3, G3, A2, C#3, E3, A3 (same as M4) -->
<circle cx="870" cy="520" r="10" fill="black" />
<circle cx="870" cy="445" r="10" fill="black" />
<circle cx="870" cy="470" r="10" fill="black" />
<circle cx="870" cy="495" r="10" fill="black" />
<circle cx="870" cy="420" r="10" fill="black" />
<circle cx="870" cy="445" r="10" fill="black" />
<circle cx="870" cy="470" r="10" fill="black" />
<circle cx="870" cy="495" r="10" fill="black" />
<line x1="870" y1="425" x2="890" y2="425" stroke="black" stroke-width="2"/>
<line x1="870" y1="475" x2="890" y2="475" stroke="black" stroke-width="2"/>
<line x1="870" y1="525" x2="890" y2="525" stroke="black" stroke-width="2"/>
<line x1="870" y1="575" x2="890" y2="575" stroke="black" stroke-width="2"/>

<!-- Measure 8 (Treble and Bass) -->
<!-- Treble: B4, C#5 -->
<circle cx="870" cy="420" r="10" fill="black" />
<circle cx="870" cy="370" r="10" fill="black" />
<line x1="870" y1="425" x2="890" y2="425" stroke="black" stroke-width="2"/>
<line x1="870" y1="375" x2="890" y2="375" stroke="black" stroke-width="2"/>

<!-- Bass: G2, B2, D3, G3, A2, C#3, E3, A3 (same as M4) -->
<circle cx="870" cy="520" r="10" fill="black" />
<circle cx="870" cy="445" r="10" fill="black" />
<circle cx="870" cy="470" r="10" fill="black" />
<circle cx="870" cy="495" r="10" fill="black" />
<circle cx="870" cy="420" r="10" fill="black" />
<circle cx="870" cy="445" r="10" fill="black" />
<circle cx="870" cy="470" r="10" fill="black" />
<circle cx="870" cy="495" r="10" fill="black" />
<line x1="870" y1="425" x2="890" y2="425" stroke="black" stroke-width="2"/>
<line x1="870" y1="475" x2="890" y2="475" stroke="black" stroke-width="2"/>
<line x1="870" y1="525" x2="890" y2="525" stroke="black" stroke-width="2"/>
<line x1="870" y1="575" x2="890" y2="575" stroke="black" stroke-width="2"/>

<!-- Dynamic Markings -->
<text x="260" y="120" font-family="Arial" font-size="30" fill="black">p</text>
<text x="660" y="120" font-family="Arial" font-size="30" fill="black">m</text>
<text x="760" y="120" font-family="Arial" font-size="30" fill="black">mf</text>

<!-- Crescendo near M4 -->
<line x1="550" y1="120" x2="650" y2="140" stroke="black" stroke-width="2"/>
<text x="600" y="100" font-family="Arial" font-size="20" fill="black">cresc.</text>

</svg>
</body>
</html>
